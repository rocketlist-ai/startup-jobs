name: Data correction
description: Report a missing, stale, or incorrect public record
title: "[data] "
labels: [data-correction]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Problem type
      options:
        - Closed or stale role
        - Broken application URL
        - Missing company or role
        - Incorrect normalized field
        - Duplicate record
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Canonical source URL
      placeholder: https://company.example/jobs/role
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What should change?
      description: Do not include personal data, credentials, or copied job descriptions.
    validations:
      required: true

